jenkins:
  systemMessage: "Jenkins configuracion inicial"
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: admin
  clouds:
    - docker:
        name: "docker-dind-cloud"
        dockerApi:
          dockerHost:
            uri: "tcp://dind:2375"
        exposeDockerHost: true